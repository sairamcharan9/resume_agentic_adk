name: Run Tests

on:
  push:
    branches: [ main, dev-* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.8, 3.9]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov
        # Install required packages one by one to handle any installation issues
        python -m pip install fastapi uvicorn python-dotenv pydantic
        python -m pip install openai python-multipart jinja2 aiofiles
        python -m pip install pygments requests
        python -m pip install langchain langchain-openai
        python -m pip install PyPDF2 pdfminer.six
        python -m pip install scikit-learn nltk pandas tiktoken
        python -m pip install spacy
        python -m pip install tqdm tenacity
    
    - name: Install NLTK and spaCy data
      run: |
        python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords'); nltk.download('wordnet')"
        python -m spacy download en_core_web_sm
    
    - name: Add project root to PYTHONPATH
      run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV
        
    - name: Run tests with pytest and coverage
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        # Run tests with pytest and generate coverage report
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
        
    - name: Generate coverage HTML report
      if: success()
      run: |
        python -m pytest tests/ --cov=src --cov-report=html
        
    - name: Upload test and coverage results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          .coverage
          coverage.xml
          htmlcov/
        retention-days: 14
